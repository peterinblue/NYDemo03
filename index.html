<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>航能智巡充换电集群管控软件 · 平台软件功能列表</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#071322;
    --bg2:#0a1a2e;
    --panel:rgba(13,33,54,.82);
    --panel2:rgba(10,26,46,.72);
    --line:#1b4468;
    --line2:#123253;
    --cyan:#00d4ff;
    --cyan-d:#0891b2;
    --green:#00ff9d;
    --orange:#ffb020;
    --red:#ff4757;
    --purple:#a78bfa;
    --txt:#e6f4fb;
    --txt2:#8fa8bd;
    --txt3:#5b7a96;
  }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(0,212,255,.10), transparent 60%),
      radial-gradient(900px 500px at 95% 0%, rgba(167,139,250,.08), transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:"Microsoft YaHei","微软雅黑","PingFang SC","Hiragino Sans GB",-apple-system,sans-serif;
    font-size:14px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 头部 ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg, rgba(7,19,34,.97), rgba(7,19,34,.88));
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(8px);
  }
  .hd-inner{
    max-width:1360px; margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  }
  .logo{
    width:38px; height:38px; flex:none; border-radius:9px;
    background:linear-gradient(135deg, var(--cyan), var(--cyan-d));
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:#04202e; font-size:17px;
    box-shadow:0 0 18px rgba(0,212,255,.35);
  }
  .hd-txt{ flex:1; min-width:240px; }
  .hd-txt h1{ font-size:19px; font-weight:700; letter-spacing:.4px; }
  .hd-txt p{ font-size:12px; color:var(--txt3); margin-top:1px; }
  .hd-stat{ display:flex; gap:22px; }
  .st{ text-align:right; }
  .st b{ display:block; font-size:20px; color:var(--cyan); font-weight:700; line-height:1.2; }
  .st span{ font-size:11px; color:var(--txt3); }
  .hd-actions{ display:flex; gap:10px; }
  .btn{
    padding:7px 14px; border-radius:7px; font-size:12.5px; cursor:pointer;
    border:1px solid var(--line); background:rgba(0,212,255,.07); color:var(--cyan);
    text-decoration:none; display:inline-flex; align-items:center; gap:5px;
    transition:.18s; white-space:nowrap;
  }
  .btn:hover{ background:rgba(0,212,255,.17); border-color:var(--cyan); }
  .btn.ghost{ background:transparent; color:var(--txt2); }
  .btn.ghost:hover{ color:var(--txt); border-color:var(--txt3); }

  /* ---------- 布局 ---------- */
  .wrap{
    max-width:1360px; margin:0 auto; padding:22px 24px 60px;
    display:grid; grid-template-columns:230px 1fr; gap:22px; align-items:start;
  }

  /* ---------- 侧栏 ---------- */
  aside{ position:sticky; top:88px; }
  .nav-box{
    background:var(--panel); border:1px solid var(--line); border-radius:11px;
    padding:12px; backdrop-filter:blur(4px);
  }
  .nav-title{
    font-size:11px; color:var(--txt3); letter-spacing:1.5px;
    padding:0 6px 9px; border-bottom:1px solid var(--line2); margin-bottom:8px;
  }
  .nav-item{
    padding:8px 10px; border-radius:7px; cursor:pointer; font-size:13px;
    color:var(--txt2); display:flex; align-items:center; gap:9px; transition:.15s;
    border:1px solid transparent;
  }
  .nav-item:hover{ background:rgba(0,212,255,.08); color:var(--txt); }
  .nav-item.on{ background:rgba(0,212,255,.15); color:var(--cyan); border-color:rgba(0,212,255,.3); }
  .nav-n{
    width:19px; height:19px; flex:none; border-radius:5px; font-size:11px;
    background:rgba(0,212,255,.14); color:var(--cyan);
    display:flex; align-items:center; justify-content:center; font-weight:600;
  }
  .nav-item.on .nav-n{ background:var(--cyan); color:#04202e; }
  .nav-item span.nm{ flex:1; }
  .nav-c{
    font-size:10.5px; color:var(--txt3); background:rgba(255,255,255,.05);
    padding:1px 6px; border-radius:9px;
  }

  .search-box{ margin-top:12px; position:relative; }
  .search-box input{
    width:100%; padding:8px 10px 8px 30px; font-size:12.5px;
    background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:7px;
    color:var(--txt); outline:none; font-family:inherit;
  }
  .search-box input:focus{ border-color:var(--cyan); }
  .search-box input::placeholder{ color:var(--txt3); }
  .search-box::before{
    content:""; position:absolute; left:10px; top:50%; transform:translateY(-50%);
    width:11px; height:11px; border:1.6px solid var(--txt3); border-radius:50%;
  }
  .search-box::after{
    content:""; position:absolute; left:19px; top:calc(50% + 3px);
    width:6px; height:1.6px; background:var(--txt3); transform:rotate(45deg);
  }

  /* ---------- 内容区 ---------- */
  main{ min-width:0; }
  .mod{ margin-bottom:26px; scroll-margin-top:96px; }
  .mod-head{
    display:flex; align-items:center; gap:12px; margin-bottom:12px;
    padding-bottom:9px; border-bottom:1px solid var(--line2);
  }
  .mod-seq{
    width:28px; height:28px; flex:none; border-radius:8px; font-size:14px; font-weight:700;
    background:linear-gradient(135deg, rgba(0,212,255,.22), rgba(0,212,255,.06));
    border:1px solid rgba(0,212,255,.35); color:var(--cyan);
    display:flex; align-items:center; justify-content:center;
  }
  .mod-head h2{ font-size:16px; font-weight:600; }
  .mod-tag{
    font-size:11px; color:var(--txt3); border:1px solid var(--line);
    padding:1px 8px; border-radius:10px;
  }
  .mod-tag.new{ color:var(--green); border-color:rgba(0,255,157,.35); background:rgba(0,255,157,.08); }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    margin-bottom:11px; overflow:hidden; transition:.2s; backdrop-filter:blur(4px);
  }
  .card:hover{ border-color:rgba(0,212,255,.4); box-shadow:0 4px 22px rgba(0,0,0,.3); }
  .card-hd{
    padding:11px 16px; display:flex; align-items:center; gap:11px; cursor:pointer;
    background:linear-gradient(90deg, rgba(0,212,255,.07), transparent);
    border-bottom:1px solid transparent; user-select:none;
  }
  .card.open .card-hd{ border-bottom-color:var(--line2); }
  .card.open .arrow{ transform:rotate(90deg); }
  .arrow{
    width:0; height:0; flex:none; transition:.2s;
    border-left:5px solid var(--cyan); border-top:4px solid transparent; border-bottom:4px solid transparent;
  }
  .card-hd h3{ font-size:14px; font-weight:600; flex:1; }
  .badge{
    font-size:10.5px; padding:2px 8px; border-radius:10px; font-weight:500;
  }
  .badge.l1{ background:rgba(0,212,255,.13); color:var(--cyan); border:1px solid rgba(0,212,255,.28); }
  .badge.warn{ background:rgba(255,176,32,.12); color:var(--orange); border:1px solid rgba(255,176,32,.3); }
  .badge.new{ background:rgba(0,255,157,.12); color:var(--green); border:1px solid rgba(0,255,157,.3); }

  .card-bd{ padding:14px 16px 15px 33px; display:none; }
  .card.open .card-bd{ display:block; }
  .card-bd p{ color:var(--txt2); font-size:13.2px; line-height:1.95; }
  .card-bd p b{ color:var(--txt); font-weight:600; }
  .note{
    margin-top:11px; padding:8px 12px; border-radius:7px; font-size:12.3px;
    background:rgba(255,176,32,.08); border-left:3px solid var(--orange); color:#ffd699;
    display:flex; gap:8px; align-items:flex-start;
  }
  .note .ic{ flex:none; font-weight:700; color:var(--orange); }

  /* ---------- 表格视图 ---------- */
  #tableView{ display:none; }
  #tableView.on{ display:block; }
  #cardView.off{ display:none; }
  table{ width:100%; border-collapse:collapse; font-size:12.6px; background:var(--panel); }
  thead th{
    background:rgba(0,212,255,.1); color:var(--cyan); font-weight:600;
    padding:10px 12px; text-align:left; border:1px solid var(--line);
    position:sticky; top:88px; font-size:12.5px; white-space:nowrap;
  }
  tbody td{ padding:10px 12px; border:1px solid var(--line2); vertical-align:top; color:var(--txt2); line-height:1.75; }
  tbody tr:nth-child(even){ background:rgba(255,255,255,.018); }
  tbody tr:hover{ background:rgba(0,212,255,.06); }
  td.c{ text-align:center; white-space:nowrap; color:var(--txt); }
  td.desc{ min-width:400px; }
  td.note{ color:#ffd699; }

  .empty{ text-align:center; padding:60px 20px; color:var(--txt3); font-size:13px; }
  footer{
    max-width:1360px; margin:0 auto; padding:18px 24px 40px;
    border-top:1px solid var(--line2); color:var(--txt3); font-size:11.5px;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }

  @media (max-width:960px){
    .wrap{ grid-template-columns:1fr; }
    aside{ position:static; }
    .hd-stat{ display:none; }
  }
</style>
</head>

</div>

<footer>

           "视频告警列表：字段含序号、告警时间（精确到秒）、告警类型、设备名称、通道名称、所属机构、设备级别、告警值、告警图片；" +

      note:"表头「设备颗别」疑为「设备级别」笔误，待确认" },
    { m2:"雷达监测", tag:"new",
      desc:"园区雷达周界监测主页，上半部分为雷达扫描态势图，下半部分为告警信息列表。" +
           "雷达扫描态势图：以多联机机组（VRF-01）为中心，外围四圈同心圆（环线间隔 10m）、十字准线与 0° / 90° / 180° / 270° 方位刻度；" +
           "扇形波束 3.6 秒 / 圈旋转扫描，目标点被波束扫过时点亮闪烁并显示标签，橙色为移动目标、红色为高危目标，中心机组图标带呼吸光圈；" +

           "告警信息列表：字段依次为告警时间、目标编号、告警类别、告警描述、方位角、距离（m）、威胁等级、处理状态、操作；" +
           "支持按告警类别 / 威胁等级 / 处理状态三个下拉筛选、关键词搜索、查询重置与导出；威胁等级与处理状态以彩色标签区分。",

  { m1:"网络管理", items:[

      desc:"园区无线自组网络监控主页。" +

           "SNR 与速率双轴趋势图（近 12 小时）。" +
           "可见卫星列表：字段含卫星编号、轨道类型、仰角、方位角、信号强度、状态，共 5 颗。今日通信业务统计。",

/* ---------------- 渲染 ---------------- */
const navEl = document.getElementById('nav');
const cvEl  = document.getElementById('cardView');
const tbEl  = document.getElementById('tb');
const emptyEl = document.getElementById('empty');

function esc(s){
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

// 把说明文本里的 ①②③④ 等编号前加分号分段高亮
function fmtDesc(s){
  return esc(s).replace(/([①②③④⑤⑥⑦⑧⑨⑩])/g, '<b>$1</b>');
}

function renderNav(){
  navEl.innerHTML = DATA.map((m,i) =>
    `<div class="nav-item${i===0?' on':''}" data-i="${i}">
       <span class="nav-n">${i+1}</span>
       <span class="nm">${esc(m.m1)}</span>
       <span class="nav-c">${m.items.length}</span>
     </div>`).join('');
  navEl.querySelectorAll('.nav-item').forEach(el => {
    el.onclick = () => {
      navEl.querySelectorAll('.nav-item').forEach(x => x.classList.remove('on'));
      el.classList.add('on');
      const target = document.getElementById('mod-' + el.dataset.i);
      if (target) window.scrollTo({ top: target.offsetTop - 88, behavior:'smooth' });
    };
  });
}

function renderCards(){
  cvEl.innerHTML = DATA.map((m,i) => {
    const hasNew = m.items.some(x => x.tag === 'new');
    const cards = m.items.map(it => {
      const tagHtml = it.tag === 'new'
        ? '<span class="badge new">新增</span>'
        : (it.note ? '<span class="badge warn">待确认</span>' : '');
      const noteHtml = it.note
        ? `<div class="note"><span class="ic">!</span><span>${esc(it.note)}</span></div>`
        : '';
      return `<div class="card${i===0?' open':''}">
          <div class="card-hd">
            <span class="arrow"></span>
            <h3>${esc(it.m2)}</h3>
            <span class="badge l1">${esc(m.m1)}</span>
            ${tagHtml}
          </div>
          <div class="card-bd">
            <p>${fmtDesc(it.desc)}</p>
            ${noteHtml}
          </div>
        </div>`;
    }).join('');
    return `<section class="mod" id="mod-${i}">
        <div class="mod-head">
          <span class="mod-seq">${i+1}</span>
          <h2>${esc(m.m1)}</h2>
          <span class="mod-tag">${m.items.length} 项功能</span>
          ${hasNew ? '<span class="mod-tag new">含新增模块</span>' : ''}
        </div>
        ${cards}
      </section>`;
  }).join('');

  cvEl.querySelectorAll('.card-hd').forEach(hd => {
    hd.onclick = () => hd.parentElement.classList.toggle('open');
  });
}

function renderTable(){
  let seq = 0;
  const rows = [];
  DATA.forEach(m => {
    m.items.forEach((it, k) => {
      seq++;
      rows.push(`<tr>
        <td class="c">${k===0 ? seq : ''}</td>
        <td class="c">${k===0 ? esc(m.m1) : ''}</td>
        <td class="c">${esc(it.m2)}</td>
        <td class="desc">${esc(it.desc)}</td>
        <td class="${it.note?'note':''}">${it.note ? esc(it.note) : '—'}</td>
      </tr>`);
    });
  });
  tbEl.innerHTML = rows.join('');
}

function renderStats(){
  const mods = DATA.length;
  const fns  = DATA.reduce((a,m) => a + m.items.length, 0);
  const notes = DATA.reduce((a,m) => a + m.items.filter(x => x.note).length, 0);
  document.getElementById('s1').textContent = mods;
  document.getElementById('s2').textContent = fns;
  document.getElementById('s3').textContent = notes;
}

/* ---------------- 交互 ---------------- */
document.getElementById('btnToggle').onclick = function(){
  const tv = document.getElementById('tableView');
  const cv = document.getElementById('cardView');
  const on = tv.classList.toggle('on');
  cv.classList.toggle('off', on);
  this.textContent = on ? '卡片视图' : '表格视图';
};

let allOpen = false;
document.getElementById('btnAll').onclick = function(){
  allOpen = !allOpen;
  cvEl.querySelectorAll('.card').forEach(c => c.classList.toggle('open', allOpen));
  this.textContent = allOpen ? '全部收起' : '全部展开';
};

document.getElementById('q').oninput = function(){
  const kw = this.value.trim().toLowerCase();
  let hit = 0;
  cvEl.querySelectorAll('.mod').forEach(sec => {
    let secHit = false;
    sec.querySelectorAll('.card').forEach(card => {
      const txt = card.textContent.toLowerCase();
      const ok = !kw || txt.includes(kw);
      card.style.display = ok ? '' : 'none';
      if (ok) { secHit = true; hit++; }
    });
    sec.style.display = secHit ? '' : 'none';
  });
  emptyEl.style.display = hit ? 'none' : 'block';
};

// 滚动高亮导航
window.addEventListener('scroll', () => {
  const tops = DATA.map((m,i) => {
    const el = document.getElementById('mod-' + i);
    return el ? el.offsetTop - 120 : 0;
  });
  let cur = 0;
  for (let i = 0; i < tops.length; i++) if (window.scrollY >= tops[i]) cur = i;
  navEl.querySelectorAll('.nav-item').forEach((el,i) => el.classList.toggle('on', i === cur));
}, { passive:true });

// 时间
function tick(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  document.getElementById('ftime').textContent =
    `最后更新：${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

renderNav(); renderCards(); renderTable(); renderStats(); tick();
</script>
</body>
</html>
